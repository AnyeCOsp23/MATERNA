[theme]
base = "light"
primaryColor = "#7B2D5B"
backgroundColor = "#F8F6F1"
secondaryBackgroundColor = "#F3E8EE"
textColor = "#3A1230"
borderColor = "#E9DDE3"
baseRadius = "14px"
baseFontSize = 15
# Tipografía del sistema (sin descargar fuentes: funciona sin internet); la misma pila que src/ui_theme.py
font = "-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, 'Segoe UI', sans-serif"

[browser]
gatherUsageStats = false

[server]
# Sirve la carpeta static/ (logo de la pantalla de bienvenida) desde el mismo servidor local: funciona offline
enableStaticServing = true

[client]
# Oculta el botón "Desplegar" y el menú de desarrollador de Streamlit: la app se usa en local
toolbarMode = "minimal"

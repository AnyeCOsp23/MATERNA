[pytest]
testpaths = tests
addopts = -ra
markers =
    e2e: pruebas de punta a punta en navegador real (requieren Chrome; activar con  pytest -m e2e)
    coherencia: pruebas de aceptación clínica del modelo principal
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::FutureWarning
